services:
  postgres:
    image: postgres:16-alpine
    container_name: haro-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${LOCAL_PG_DB:-haro}
      POSTGRES_USER: ${LOCAL_PG_USER:-haro}
      POSTGRES_PASSWORD: ${LOCAL_PG_PASSWORD:-haro123}
    ports:
      - "${LOCAL_PG_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${LOCAL_PG_USER:-haro} -d ${LOCAL_PG_DB:-haro}"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - haro_postgres_data:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: haro-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      PORT: 8080
      DB_URL: jdbc:postgresql://postgres:5432/${LOCAL_PG_DB:-haro}
      DB_USERNAME: ${LOCAL_PG_USER:-haro}
      DB_PASSWORD: ${LOCAL_PG_PASSWORD:-haro123}
    ports:
      - "${API_PORT:-8080}:8080"
    volumes:
      - haro_uploads:/app/uploads

volumes:
  haro_postgres_data:
  haro_uploads:
