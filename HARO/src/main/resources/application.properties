spring.main.banner-mode=console
spring.banner.charset=UTF-8
spring.application.name=HARO
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/postgres?useSSL=false&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:change_me}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.default_batch_fetch_size=50

# Usuario en memoria para pruebas
spring.security.user.name=${BOOTSTRAP_USER:admin}
spring.security.user.password=${BOOTSTRAP_PASSWORD:change_me_admin}
spring.security.user.roles=${BOOTSTRAP_ROLES:ADMIN}

server.port=8083

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
# timeouts para evitar cortes raros
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

# MUY IMPORTANTE en Gmail personal:
app.verification.from=${MAIL_FROM:${spring.mail.username:}}


# HS256 con clave >= 256 bits (32 bytes). Ejemplo en base64 (NO usar este en prod):
app.jwt.secret=${JWT_SECRET:CHANGE_ME_WITH_AT_LEAST_32_CHARACTERS}
app.jwt.issuer=${JWT_ISSUER:HARO}
app.jwt.access.minutes=${JWT_ACCESS_MINUTES:15}
app.jwt.refresh.days=${JWT_REFRESH_DAYS:7}
app.auth.pepper=${AUTH_PEPPER:CHANGE_ME_WITH_ANOTHER_SECRET}

# Contract verification links
app.contract.verify.code.length=${CONTRACT_VERIFY_CODE_LENGTH:10}
app.contract.verify.ttlSeconds=${CONTRACT_VERIFY_TTL_SECONDS:2400}
app.contract.verify.base-url=${CONTRACT_VERIFY_BASE_URL:http://localhost:8081}
app.contract.verify.path=${CONTRACT_VERIFY_PATH:/api/verification/contract/verify}

# Google Calendar
google.calendar.auth-mode=${GOOGLE_CALENDAR_AUTH_MODE:service_account}
google.calendar.credentials.path=${GOOGLE_CALENDAR_CREDENTIALS_PATH:}
google.calendar.oauth.client-secrets.path=${GOOGLE_CALENDAR_OAUTH_CLIENT_SECRETS_PATH:}
google.calendar.oauth.tokens.dir=${GOOGLE_CALENDAR_OAUTH_TOKENS_DIR:.tokens/google-calendar}
google.calendar.oauth.user-id=${GOOGLE_CALENDAR_OAUTH_USER_ID:default}
google.calendar.oauth.local-receiver-port=${GOOGLE_CALENDAR_OAUTH_LOCAL_RECEIVER_PORT:8888}
google.calendar.default-id=${GOOGLE_CALENDAR_ID:primary}
google.calendar.application-name=${GOOGLE_CALENDAR_APP_NAME:HARO}
google.calendar.default-timezone=${GOOGLE_CALENDAR_TIMEZONE:America/Bogota}

# ePayco (NO las quemes en código)
epayco.p-cust-id-cliente=${EPAYCO_P_CUST_ID_CLIENTE}
epayco.p-key=${EPAYCO_P_KEY}
epayco.validation-url=https://secure.epayco.co/validation/v1/reference/

# WhatsApp Cloud API (Meta)
whatsapp.enabled=${WHATSAPP_ENABLED:false}
whatsapp.api-base-url=${WHATSAPP_API_BASE_URL:https://graph.facebook.com}
whatsapp.api-version=${WHATSAPP_API_VERSION:v21.0}
whatsapp.phone-number-id=${WHATSAPP_PHONE_NUMBER_ID:}
whatsapp.access-token=${WHATSAPP_ACCESS_TOKEN:}
whatsapp.default-to=${WHATSAPP_DEFAULT_TO:}
whatsapp.restrict-to-default=${WHATSAPP_RESTRICT_TO_DEFAULT:true}
whatsapp.default-language-code=${WHATSAPP_DEFAULT_LANGUAGE_CODE:es_CO}
whatsapp.webhook-verify-token=${WHATSAPP_WEBHOOK_VERIFY_TOKEN:}
whatsapp.app-secret=${WHATSAPP_APP_SECRET:}
whatsapp.bot-enabled=${WHATSAPP_BOT_ENABLED:false}
whatsapp.bot-welcome-reply=${WHATSAPP_BOT_WELCOME_REPLY:Bienvenido a CEA HARO. Soy tu asistente virtual. Escribe MENU para continuar.}
whatsapp.bot-fallback-reply=${WHATSAPP_BOT_FALLBACK_REPLY:Gracias por escribir a CEA HARO. Escribe MENU para ver opciones.}
whatsapp.connect-timeout-ms=${WHATSAPP_CONNECT_TIMEOUT_MS:10000}
whatsapp.read-timeout-ms=${WHATSAPP_READ_TIMEOUT_MS:20000}

# Chatbot flow
chatbot.payment.link=${CHATBOT_PAYMENT_LINK:https://epayco-link.com}
chatbot.contract.base-url=${CHATBOT_CONTRACT_BASE_URL:}
chatbot.booking.duration.minutes=${CHATBOT_BOOKING_DURATION_MINUTES:120}
chatbot.inactivity.timeout.minutes=${CHATBOT_INACTIVITY_TIMEOUT_MINUTES:20}
chatbot.booking.calendar.id=${CHATBOT_BOOKING_CALENDAR_ID:}
chatbot.booking.calendar.timezone=${CHATBOT_BOOKING_CALENDAR_TIMEZONE:America/Bogota}
chatbot.booking.cancel.min-hours=${CHATBOT_BOOKING_CANCEL_MIN_HOURS:48}
chatbot.booking.cancel.late-fee=${CHATBOT_BOOKING_CANCEL_LATE_FEE:0}
chatbot.pricing.a2=${CHATBOT_PRICING_A2:0}
chatbot.pricing.b1=${CHATBOT_PRICING_B1:0}
chatbot.pricing.c1=${CHATBOT_PRICING_C1:0}
chatbot.pricing.a2b1=${CHATBOT_PRICING_A2_B1:0}
chatbot.pricing.a2b1c1=${CHATBOT_PRICING_A2_B1_C1:0}
