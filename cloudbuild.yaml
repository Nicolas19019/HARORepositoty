substitutions:
  _SERVICE: harorepositoty2
  _REGION: europe-west1
  _AR_REPO: cloud-run-source-deploy
  _IMAGE: harorepositoty
  _CLOUDSQL_INSTANCE: project-f1792676-13e6-44c2-a20:us-central1:haro-postgres
  _DB_NAME: postgres
  _DB_USER: HARODB
  _STORAGE_PROVIDER: s3
  _S3_BUCKET: haro-files
  _S3_BASE_PATH: clases
  _S3_PUBLIC_BASE_URL: https://haro-files.s3.us-east-2.amazonaws.com
  _AWS_REGION: us-east-2
  _SPRING_PROFILES_ACTIVE: cloudrun
  _RUN_SERVICE_ACCOUNT: 590358146556-compute@developer.gserviceaccount.com
  _GOOGLE_CALENDAR_AUTH_MODE: oauth_user
  _GOOGLE_CALENDAR_ID: primary
  _GOOGLE_CALENDAR_FALLBACK_TO_TEMPLATE_LINK: false
  _WHATSAPP_PHONE_NUMBER_ID: "1054029677788707"

steps:
  - name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -c
      - |
        IMAGE_REF="${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO,,}/${_IMAGE,,}:$SHORT_SHA"
        docker build -t "$IMAGE_REF" .

  - name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -c
      - |
        IMAGE_REF="${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO,,}/${_IMAGE,,}:$SHORT_SHA"
        docker push "$IMAGE_REF"

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    args:
      - -c
      - |
        IMAGE_REF="${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO,,}/${_IMAGE,,}:$SHORT_SHA"
        CLOUD_SQL_JDBC_URL="jdbc:postgresql:///${_DB_NAME}?socketFactory=com.google.cloud.sql.postgres.SocketFactory&cloudSqlInstance=${_CLOUDSQL_INSTANCE}&cloudSqlRefreshStrategy=lazy"

        gcloud run deploy ${_SERVICE} \
          --region ${_REGION} \
          --platform managed \
          --allow-unauthenticated \
          --service-account ${_RUN_SERVICE_ACCOUNT} \
          --port 8081 \
          --image "$IMAGE_REF" \
          --add-cloudsql-instances ${_CLOUDSQL_INSTANCE} \
          --set-env-vars "SPRING_PROFILES_ACTIVE=${_SPRING_PROFILES_ACTIVE},CLOUD_SQL_INSTANCE=${_CLOUDSQL_INSTANCE},DB_NAME=${_DB_NAME},DB_USERNAME=${_DB_USER},DB_URL=${CLOUD_SQL_JDBC_URL},SPRING_DATASOURCE_USERNAME=${_DB_USER},SPRING_DATASOURCE_URL=${CLOUD_SQL_JDBC_URL},STORAGE_PROVIDER=${_STORAGE_PROVIDER},S3_BUCKET=${_S3_BUCKET},S3_BASE_PATH=${_S3_BASE_PATH},S3_PUBLIC_BASE_URL=${_S3_PUBLIC_BASE_URL},AWS_REGION=${_AWS_REGION},CHATBOT_INACTIVITY_TIMEOUT_MINUTES=15,CHATBOT_CONTRACT_BASE_URL=https://ceaharo.com,CHATBOT_CONTRACT_UI_URL=https://ceaharo.com/contrato.html,CHATBOT_CONTRACT_STORAGE_BASE_PATH=contratos/,GOOGLE_CALENDAR_AUTH_MODE=${_GOOGLE_CALENDAR_AUTH_MODE},GOOGLE_CALENDAR_ID=${_GOOGLE_CALENDAR_ID},GOOGLE_CALENDAR_FALLBACK_TO_TEMPLATE_LINK=${_GOOGLE_CALENDAR_FALLBACK_TO_TEMPLATE_LINK},APP_VERIFICATION_LOGO_URL=https://haro-files.s3.us-east-2.amazonaws.com/clases/clase-1/imagen/2026/03/logoSinFondo.png,APP_INTERNAL_API_BASE_URL=https://harorepositoty2-590358146556.europe-west1.run.app,WHATSAPP_ENABLED=true,WHATSAPP_BOT_ENABLED=true,WHATSAPP_RESTRICT_TO_DEFAULT=false,WHATSAPP_DEFAULT_LANGUAGE_CODE=es_CO,WHATSAPP_API_BASE_URL=https://graph.facebook.com,WHATSAPP_API_VERSION=v21.0,WHATSAPP_PHONE_NUMBER_ID=${_WHATSAPP_PHONE_NUMBER_ID}" \
          --set-secrets "DB_PASSWORD=DB_PASSWORD:latest,JWT_SECRET=JWT_SECRET:latest,AUTH_PEPPER=AUTH_PEPPER:latest,GOOGLE_CALENDAR_OAUTH_CLIENT_SECRETS_JSON=GOOGLE_CALENDAR_OAUTH_CLIENT_SECRETS_JSON:latest,GOOGLE_CALENDAR_OAUTH_REFRESH_TOKEN=GOOGLE_CALENDAR_OAUTH_REFRESH_TOKEN:latest,AWS_ACCESS_KEY_ID=AWS_ACCESS_KEY_ID:latest,AWS_SECRET_ACCESS_KEY=AWS_SECRET_ACCESS_KEY:latest,WHATSAPP_ACCESS_TOKEN=WHATSAPP_ACCESS_TOKEN:latest"
