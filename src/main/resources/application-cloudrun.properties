# Cloud Run profile: force Cloud SQL Java Connector URL to avoid direct public IP usage.
spring.datasource.url=jdbc:postgresql:///${DB_NAME:postgres}?socketFactory=com.google.cloud.sql.postgres.SocketFactory&cloudSqlInstance=${CLOUD_SQL_INSTANCE}&cloudSqlRefreshStrategy=lazy
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:}}
