spring.main.banner-mode=console
spring.banner.charset=UTF-8
spring.application.name=HARO
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${DB_URL:${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/postgres}}
spring.datasource.username=${DB_USERNAME:${SPRING_DATASOURCE_USERNAME:}}
spring.datasource.password=${DB_PASSWORD:${SPRING_DATASOURCE_PASSWORD:}}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.default_batch_fetch_size=50

# Usuario en memoria para pruebas
spring.security.user.name=${BOOTSTRAP_USER:admin}
spring.security.user.password=${BOOTSTRAP_PASSWORD:change_me_admin}
spring.security.user.roles=${BOOTSTRAP_ROLES:ADMIN}

server.port=${PORT:8080}

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
# timeouts para evitar cortes raros
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

# MUY IMPORTANTE en Gmail personal:
app.verification.from=${MAIL_FROM:${spring.mail.username:}}
app.verification.logo-url=${APP_VERIFICATION_LOGO_URL:}


# HS256 con clave >= 256 bits (32 bytes). Ejemplo en base64 (NO usar este en prod):
app.jwt.secret=${JWT_SECRET:CHANGE_ME_WITH_AT_LEAST_32_CHARACTERS}
app.jwt.issuer=${JWT_ISSUER:HARO}
app.jwt.access.minutes=${JWT_ACCESS_MINUTES:15}
app.jwt.refresh.days=${JWT_REFRESH_DAYS:7}
app.auth.pepper=${AUTH_PEPPER:CHANGE_ME_WITH_ANOTHER_SECRET}

# Contract verification links
app.contract.verify.code.length=${CONTRACT_VERIFY_CODE_LENGTH:10}
app.contract.verify.ttlSeconds=${CONTRACT_VERIFY_TTL_SECONDS:2400}
app.contract.verify.base-url=${CONTRACT_VERIFY_BASE_URL:http://localhost:8081}
app.contract.verify.path=${CONTRACT_VERIFY_PATH:/api/verification/contract/verify}

# Google Calendar
google.calendar.auth.mode=${GOOGLE_CALENDAR_AUTH_MODE:auto}
google.calendar.oauth.client-secrets.json=${GOOGLE_CALENDAR_OAUTH_CLIENT_SECRETS_JSON:}
google.calendar.oauth.client-secrets.path=${GOOGLE_CALENDAR_OAUTH_CLIENT_SECRETS_PATH:Secrets/google-oauth-client.json}
google.calendar.oauth.tokens.dir=${GOOGLE_CALENDAR_OAUTH_TOKENS_DIR:.tokens/google-calendar}
google.calendar.oauth.user-id=${GOOGLE_CALENDAR_OAUTH_USER_ID:default}
google.calendar.oauth.local-receiver-port=${GOOGLE_CALENDAR_OAUTH_LOCAL_RECEIVER_PORT:8888}
google.calendar.oauth.client-id=${GOOGLE_CALENDAR_OAUTH_CLIENT_ID:}
google.calendar.oauth.client-secret=${GOOGLE_CALENDAR_OAUTH_CLIENT_SECRET:}
google.calendar.oauth.refresh-token=${GOOGLE_CALENDAR_OAUTH_REFRESH_TOKEN:}
google.calendar.service-account.json=${GOOGLE_CALENDAR_SERVICE_ACCOUNT_JSON:}
google.calendar.service-account.path=${GOOGLE_CALENDAR_SERVICE_ACCOUNT_PATH:Secrets/google-service-account.json}
google.calendar.service-account.user=${GOOGLE_CALENDAR_SERVICE_ACCOUNT_USER:}
google.calendar.default-id=${GOOGLE_CALENDAR_ID:primary}
google.calendar.application-name=${GOOGLE_CALENDAR_APP_NAME:HARO}
google.calendar.default-timezone=${GOOGLE_CALENDAR_TIMEZONE:America/Bogota}

# ePayco (NO las quemes en código)
epayco.p-cust-id-cliente=${EPAYCO_P_CUST_ID_CLIENTE}
epayco.p-key=${EPAYCO_P_KEY}
epayco.validation-url=https://secure.epayco.co/validation/v1/reference/

# WhatsApp Cloud API (Meta)
whatsapp.enabled=${WHATSAPP_ENABLED:false}
whatsapp.api-base-url=${WHATSAPP_API_BASE_URL:https://graph.facebook.com}
whatsapp.api-version=${WHATSAPP_API_VERSION:v21.0}
whatsapp.phone-number-id=${WHATSAPP_PHONE_NUMBER_ID:}
whatsapp.access-token=${WHATSAPP_ACCESS_TOKEN:}
whatsapp.default-to=${WHATSAPP_DEFAULT_TO:}
whatsapp.restrict-to-default=${WHATSAPP_RESTRICT_TO_DEFAULT:true}
whatsapp.default-language-code=${WHATSAPP_DEFAULT_LANGUAGE_CODE:es_CO}
whatsapp.webhook-verify-token=${WHATSAPP_WEBHOOK_VERIFY_TOKEN:}
whatsapp.app-secret=${WHATSAPP_APP_SECRET:}
whatsapp.bot-enabled=${WHATSAPP_BOT_ENABLED:false}
whatsapp.bot-welcome-reply=${WHATSAPP_BOT_WELCOME_REPLY:Bienvenido a CEA HARO. Soy tu asistente virtual. Escribe MENU para continuar.}
whatsapp.bot-fallback-reply=${WHATSAPP_BOT_FALLBACK_REPLY:Gracias por escribir a CEA HARO. Escribe MENU para ver opciones.}
whatsapp.connect-timeout-ms=${WHATSAPP_CONNECT_TIMEOUT_MS:10000}
whatsapp.read-timeout-ms=${WHATSAPP_READ_TIMEOUT_MS:20000}

# Chatbot flow
chatbot.payment.link=${CHATBOT_PAYMENT_LINK:https://epayco-link.com}
chatbot.payment.link.a2=${CHATBOT_PAYMENT_LINK_A2:}
chatbot.payment.link.b1=${CHATBOT_PAYMENT_LINK_B1:}
chatbot.payment.link.c1=${CHATBOT_PAYMENT_LINK_C1:}
chatbot.payment.link.a2b1=${CHATBOT_PAYMENT_LINK_A2_B1:}
chatbot.payment.link.a2c1=${CHATBOT_PAYMENT_LINK_A2_C1:}
chatbot.payment.link.b1c1=${CHATBOT_PAYMENT_LINK_B1_C1:}
chatbot.payment.link.a2b1c1=${CHATBOT_PAYMENT_LINK_A2_B1_C1:}
chatbot.payment.confirmation-url=${CHATBOT_PAYMENT_CONFIRMATION_URL:https://ceaharo.com/confirmation}
chatbot.payment.return-url=${CHATBOT_PAYMENT_RETURN_URL:https://ceaharo.com/respuesta.html}
chatbot.payment.param.document=${CHATBOT_PAYMENT_PARAM_DOCUMENT:x_extra1}
chatbot.payment.param.email=${CHATBOT_PAYMENT_PARAM_EMAIL:customer_email}
chatbot.payment.param.amount=${CHATBOT_PAYMENT_PARAM_AMOUNT:x_amount}
chatbot.payment.param.confirmation=${CHATBOT_PAYMENT_PARAM_CONFIRMATION:confirmation}
chatbot.payment.param.return=${CHATBOT_PAYMENT_PARAM_RETURN:response}
chatbot.enrollment.welcome-image-url=${CHATBOT_ENROLLMENT_WELCOME_IMAGE_URL:}
chatbot.inbound.include-image-action=${CHATBOT_INBOUND_INCLUDE_IMAGE_ACTION:false}
chatbot.contract.base-url=${CHATBOT_CONTRACT_BASE_URL:}
chatbot.contract.ui-url=${CHATBOT_CONTRACT_UI_URL:}
chatbot.contract.storage.base-path=${CHATBOT_CONTRACT_STORAGE_BASE_PATH:contratos/}
chatbot.auto-send-contract-on-payment=${CHATBOT_AUTO_SEND_CONTRACT_ON_PAYMENT:true}
chatbot.booking.duration.minutes=${CHATBOT_BOOKING_DURATION_MINUTES:120}
chatbot.inactivity.timeout.minutes=${CHATBOT_INACTIVITY_TIMEOUT_MINUTES:15}
chatbot.booking.calendar.id=${CHATBOT_BOOKING_CALENDAR_ID:}
chatbot.booking.calendar.timezone=${CHATBOT_BOOKING_CALENDAR_TIMEZONE:America/Bogota}
chatbot.booking.cancel.min-hours=${CHATBOT_BOOKING_CANCEL_MIN_HOURS:48}
chatbot.booking.cancel.late-fee=${CHATBOT_BOOKING_CANCEL_LATE_FEE:0}
chatbot.pricing.a2=${CHATBOT_PRICING_A2:0}
chatbot.pricing.b1=${CHATBOT_PRICING_B1:0}
chatbot.pricing.c1=${CHATBOT_PRICING_C1:0}
chatbot.pricing.a2b1=${CHATBOT_PRICING_A2_B1:0}
chatbot.pricing.a2b1c1=${CHATBOT_PRICING_A2_B1_C1:0}

# Uploads modulo de aprendizaje
app.upload.dir=${APP_UPLOAD_DIR:uploads}
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# Storage (local o s3)
storage.provider=${STORAGE_PROVIDER:local}
aws.region=${AWS_REGION:us-east-2}
aws.access-key-id=${AWS_ACCESS_KEY_ID:}
aws.secret-access-key=${AWS_SECRET_ACCESS_KEY:}
s3.bucket=${S3_BUCKET:}
s3.base-path=${S3_BASE_PATH:clases/}
s3.public-base-url=${S3_PUBLIC_BASE_URL:}

# Recuperacion de contrasena (modulo aprendizaje)
app.recovery.subject=${APP_RECOVERY_SUBJECT:Recuperacion de acceso - Modulo de gestion de aprendizaje}
app.recovery.temp-password.length=${APP_RECOVERY_TEMP_PASSWORD_LENGTH:10}

# Conversion de diapositivas a preview PDF (requiere LibreOffice/soffice instalado)
app.slides.converter.command=${APP_SLIDES_CONVERTER_COMMAND:soffice}
